# Baut die Webseite (tools/seiten_bauen.py) und veröffentlicht sie auf GitHub Pages.
# Voraussetzung (einmalig): Settings → Pages → Source: "GitHub Actions".
name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # für das Änderungsdatum der Seiten in der Sitemap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seiten bauen
        run: python tools/seiten_bauen.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
